<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Una piccola sorpresa per voi…</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* ===== COLORI: modificali qui ===== */
:root{
  --bg:#f8efe3; --bg2:#f3dfd8; --ink:#4b3f39; --soft:#8a7a70;
  --rose:#e3b1a8; --sage:#a3b59b; --gold:#c4993f; --card:#fffaf3;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#2d2522; --bg2:#3b2c2a; --ink:#f6eadf; --soft:#c5b3a6; --card:#3a302c;}}
:root[data-theme="dark"]{--bg:#2d2522; --bg2:#3b2c2a; --ink:#f6eadf; --soft:#c5b3a6; --card:#3a302c;}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;height:100%;overflow:hidden;font-family:'Nunito',system-ui,sans-serif;color:var(--ink);
  background:radial-gradient(circle at 30% 10%,var(--bg2),var(--bg) 70%);}
#app{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:56px 22px 28px;position:relative}
#stage{width:100%;max-width:440px;text-align:center;transition:opacity .35s ease,transform .35s ease;max-height:100%;overflow-y:auto}
#stage.out{opacity:0;transform:translateY(14px) scale(.98)}
h1,h2,.big{font-family:'Cormorant Garamond',Georgia,serif;font-weight:600;line-height:1.15;margin:0 0 14px}
h2{font-size:2rem}
p{font-size:1.15rem;line-height:1.55;margin:0 0 14px}
.sub{color:var(--soft)}
.btn{display:block;width:100%;min-height:58px;margin:12px 0;padding:14px 18px;font:700 1.1rem 'Nunito',sans-serif;color:var(--ink);
  background:var(--card);border:1.5px solid var(--rose);border-radius:18px;cursor:pointer;transition:transform .15s,background .2s,opacity .3s}
.btn:active{transform:scale(.97)}
.btn.main{background:linear-gradient(135deg,var(--rose),#d99a90);color:#fff;border:none;box-shadow:0 8px 22px rgba(217,154,144,.45)}
.btn.sage{border-color:var(--sage)}
.btn.ok{background:var(--sage);color:#fff;border-color:var(--sage)}
.btn[disabled]{opacity:.45}
.msg{min-height:30px;font-style:italic;color:var(--gold);font-weight:600;margin:6px 0}
.pop{animation:pop .5s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{opacity:0;transform:scale(.8)}to{opacity:1;transform:scale(1)}}
.shake{animation:shake .45s}
@keyframes shake{25%{transform:translateX(-8px)}50%{transform:translateX(8px)}75%{transform:translateX(-5px)}}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:18px 0}
.box{aspect-ratio:1;font-size:2.6rem;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
.box small{font:700 .85rem 'Nunito',sans-serif;color:var(--soft)}
.box.done{background:var(--sage);border-color:var(--sage)}
.box.done small{color:#fff}
#bar{position:absolute;top:calc(env(safe-area-inset-top,0px) + 16px);left:22px;right:70px;display:flex;align-items:center;gap:10px;font-size:.85rem;color:var(--soft);font-weight:700;transition:opacity .4s}
#bar i{flex:1;height:5px;border-radius:5px;background:rgba(0,0,0,.08);overflow:hidden}
#bar b{display:block;height:100%;width:0;background:var(--gold);transition:width .5s ease}
#snd{position:absolute;top:calc(env(safe-area-inset-top,0px) + 8px);right:16px;width:48px;height:48px;border-radius:50%;border:1.5px solid var(--rose);background:var(--card);font-size:1.3rem;cursor:pointer}
#modal{position:fixed;inset:0;background:rgba(40,28,24,.55);display:none;align-items:center;justify-content:center;padding:24px;z-index:20}
#modal.on{display:flex}
#modal div{background:var(--card);border-radius:24px;padding:30px 24px;max-width:380px;width:100%;text-align:center;animation:pop .45s cubic-bezier(.2,1.4,.4,1)}
.count{font:600 9rem 'Cormorant Garamond',serif;color:var(--gold);animation:pop .8s ease}
.big{font-size:2.9rem;color:var(--ink)}
.photo{width:100%;aspect-ratio:4/3;border:2px dashed var(--gold);border-radius:20px;display:flex;align-items:center;justify-content:center;color:var(--soft);margin:14px 0;overflow:hidden;font-weight:700}
.photo:has(img){aspect-ratio:auto;border:none;border-radius:20px}
.photo img{width:100%;height:auto;display:block;border-radius:20px}
.gold{color:var(--gold)}
#fx{position:fixed;inset:0;pointer-events:none;z-index:10}
.heart{position:fixed;bottom:-30px;pointer-events:none;z-index:9;animation:up linear forwards}
@keyframes up{to{transform:translateY(-115vh) rotate(25deg);opacity:0}}
.rev{opacity:0;transform:translateY(16px);animation:in 1s ease forwards}
@keyframes in{to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;transition-duration:.01s!important}}
</style>
</head>
<body>
<div id="app">
  <div id="bar"><span id="num">1/6</span><i><b id="fill"></b></i></div>
  <button id="snd" aria-label="Audio">🔇</button>
  <div id="stage"></div>
</div>
<div id="modal"><div><p id="mtext" style="font-family:'Cormorant Garamond',serif;font-size:1.7rem;font-weight:600"></p><button class="btn main" id="mclose">OK</button></div></div>
<canvas id="fx"></canvas>

  bye:"Ci vediamo presto, nonni."
};

/* ===== MOTORE ===== */
const $=s=>document.querySelector(s), stage=$('#stage');
let sound=false, ctx=null;
function beep(f=520,d=.15){ if(!sound)return; try{ctx=ctx||new (window.AudioContext||window.webkitAudioContext)();
  const o=ctx.createOscillator(),g=ctx.createGain();o.frequency.value=f;o.type='sine';g.gain.value=.12;
  o.connect(g);g.connect(ctx.destination);o.start();g.gain.exponentialRampToValueAtTime(.0001,ctx.currentTime+d);o.stop(ctx.currentTime+d);}catch(e){} }
$('#snd').onclick=()=>{sound=!sound;$('#snd').textContent=sound?'🔊':'🔇';beep(660)};
function bar(n){const b=$('#bar');if(!n){b.style.opacity=0;return}b.style.opacity=1;$('#num').textContent=n+'/6';$('#fill').style.width=(n/6*100)+'%'}
function show(html,n,after){stage.classList.add('out');setTimeout(()=>{stage.innerHTML=html;stage.scrollTop=0;stage.classList.remove('out');bar(n);after&&after()},380)}
const msg=t=>{const m=$('#msg');m.textContent=t;m.classList.remove('pop');void m.offsetWidth;m.classList.add('pop')};

/* 1 — INTRO */
function s1(){show(`<h1 style="font-size:2.5rem">${T.intro1}</h1><p class="sub">${T.intro2}</p>
  <button class="btn main" id="go" style="margin-top:28px">INIZIAMO →</button>`,1,()=>$('#go').onclick=()=>{beep(520);s2()})}

/* 2 — QUANTO CI CONOSCETE */
function s2(){show(`<h2>${T.q1}</h2>${T.q1opts.map((o,i)=>`<button class="btn" data-i="${i}">${o[0]}</button>`).join('')}
  <div class="msg" id="msg"></div><button class="btn main" id="nx" style="display:none">CONTINUA →</button>`,2,()=>{
  stage.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{beep(600);msg(T.q1opts[b.dataset.i][1]);$('#nx').style.display='block';$('#nx').classList.add('pop')});
  $('#nx').onclick=s3})}

/* 3 — INDOVINELLO */
function s3(){show(`<h2>${T.q2}</h2>${T.q2opts.map((o,i)=>`<button class="btn" data-i="${i}">${o}</button>`).join('')}
  <div class="msg" id="msg"></div><button class="btn main" id="nx" style="display:none">AVANTI →</button>`,3,()=>{
  stage.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{
    if(+b.dataset.i===T.q2right){beep(780);b.classList.add('ok');msg(T.q2ok);$('#nx').style.display='block';$('#nx').classList.add('pop')}
    else{beep(200,.25);b.classList.add('shake');b.disabled=true;msg(T.q2wrong)}});
  $('#nx').onclick=s4})}

/* 4 — INDIZI */
function s4(){let seen=0;
  show(`<h2>Quattro indizi</h2><p class="sub">Toccateli uno alla volta.</p>
  <div class="grid">${T.clues.map((c,i)=>`<button class="btn box" data-i="${i}">${c[0]}<small>Indizio ${i+1}</small></button>`).join('')}</div>
  <div id="more"></div>`,4,()=>{
  stage.querySelectorAll('.box').forEach(b=>b.onclick=()=>{
    beep(500+b.dataset.i*90);$('#mtext').textContent=T.clues[b.dataset.i][1];$('#modal').classList.add('on');
    if(!b.classList.contains('done')){b.classList.add('done');seen++}
    $('#mclose').onclick=()=>{$('#modal').classList.remove('on');
      if(seen===4&&!$('#fm')){$('#more').innerHTML=`<p class="big pop" id="fm" style="font-size:2rem">Credete di aver capito?</p><button class="btn main pop" id="nx">FORSE… 🤔</button>`;$('#nx').onclick=s5}}})})}

/* 5 — SCELTA FINALE */
function s5(){let tries=0;
  show(`<h2>${T.last1}</h2><p>${T.last2}</p><button class="btn main" id="yes" style="margin-top:22px">${T.yes}</button>
  <button class="btn" id="no">${T.no}</button><div class="msg" id="msg"></div>`,5,()=>{
  $('#yes').onclick=()=>{beep(700);s6()};
  $('#no').onclick=()=>{tries++;beep(220,.2);msg(T.noMsg);$('#no').classList.add('shake');
    setTimeout(()=>$('#no').classList.remove('shake'),500);
    $('#yes').style.transform=`scale(${1+tries*.06})`;
    if(tries>=2){$('#no').style.opacity=0;$('#no').disabled=true}}})}

/* 6 — COUNTDOWN */
function s6(){show(`<div class="big" id="cd">Ok…</div>`,6,()=>{
  const seq=['3','2','1'];let i=0;
  setTimeout(function tick(){ if(i<3){const el=$('#cd');el.className='count';el.style.animation='none';void el.offsetWidth;el.style.animation='';el.textContent=seq[i];beep(440+i*120,.3);i++;setTimeout(tick,1000)}else{beep(880,.6);s7()}},1100)})}

/* 7 — RIVELAZIONE */
function s7(){
  const ph=T.photo?`<img src="${T.photo}" alt="">`:'[FOTO / ECOGRAFIA]';
  show(`<div class="big rev">${T.reveal}</div>
  <p class="rev" style="animation-delay:.9s">${T.r1}</p>
  <p class="rev" style="animation-delay:1.8s">${T.r2}</p>
  <div class="photo rev" style="animation-delay:2.7s">${ph}</div>
  <p class="rev gold" style="animation-delay:3.5s;font-family:'Cormorant Garamond',serif;font-size:1.6rem;font-style:italic">${T.r3}</p>
  <p class="rev" style="animation-delay:4.3s;font-weight:700">${T.bye}</p>`,0,()=>{confetti();hearts();beep(660,.5);setTimeout(()=>beep(880,.6),250)})}

/* ===== EFFETTI ===== */
function confetti(){
  const c=$('#fx'),x=c.getContext('2d');c.width=innerWidth;c.height=innerHeight;
  const cols=['#e3b1a8','#a3b59b','#c4993f','#f3dfd8','#fff'];
  const P=Array.from({length:130},()=>({x:Math.random()*c.width,y:-Math.random()*c.height*.8,r:4+Math.random()*6,
    vy:1.5+Math.random()*3,vx:-1+Math.random()*2,a:Math.random()*6,va:Math.random()*.2,col:cols[Math.random()*5|0]}));
  const t0=performance.now();
  (function f(t){x.clearRect(0,0,c.width,c.height);const live=t-t0<9000;
    P.forEach(p=>{p.y+=p.vy;p.x+=p.vx+Math.sin(p.a);p.a+=p.va;if(p.y>c.height&&live){p.y=-10}
      x.save();x.translate(p.x,p.y);x.rotate(p.a);x.fillStyle=p.col;x.fillRect(-p.r/2,-p.r/4,p.r,p.r/2);x.restore()});
    if(live||P.some(p=>p.y<c.height))requestAnimationFrame(f);else x.clearRect(0,0,c.width,c.height)})(t0);
}
function hearts(){
  const e=['❤️','🤍','🩷','✨'];let n=0;
  const id=setInterval(()=>{const h=document.createElement('span');h.className='heart';h.textContent=e[Math.random()*4|0];
    h.style.left=Math.random()*95+'vw';h.style.fontSize=(16+Math.random()*22)+'px';h.style.animationDuration=(5+Math.random()*4)+'s';
    document.body.appendChild(h);setTimeout(()=>h.remove(),9500);if(++n>60)clearInterval(id)},350);
}
s1();
</script>
